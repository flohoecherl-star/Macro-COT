<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makro &amp; COT Lab — Daten lesen, News beurteilen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EE;
  --paper-2:#FFFDF8;
  --ink:#1B1917;
  --muted:#6E675C;
  --rule:#DFD8C9;
  --rule-soft:#EBE5D9;
  --navy:#1F3A5F;
  --bull:#2E6B4F;
  --bear:#A33B32;
  --amber:#B5852B;
  --shadow:0 1px 0 rgba(27,25,23,.06), 0 8px 24px -18px rgba(27,25,23,.5);
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter', system-ui, sans-serif;
  font-size:15px; line-height:1.55;
  padding-bottom:88px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px; margin:0 auto; padding:0 16px}

/* ---------- Kopf: Wire-Ticker Anmutung ---------- */
header.masthead{
  border-bottom:1.5px solid var(--ink);
  padding:22px 0 12px; margin-bottom:18px;
}
.masthead .kicker{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; gap:12px;
}
.masthead h1{
  font-family:'Fraunces', Georgia, serif; font-weight:600;
  font-size:clamp(28px,7vw,42px); line-height:1.02; margin:8px 0 6px; letter-spacing:-.02em;
}
.masthead p{margin:0; color:var(--muted); font-size:13.5px; max-width:56ch}

/* ---------- Tabs ---------- */
nav.tabs{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--rule); margin:0 -16px 20px; padding:0 8px;
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
.tabrow{display:flex; gap:2px; min-width:max-content}
.tab{
  appearance:none; border:0; background:none; cursor:pointer;
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); padding:12px 10px; border-bottom:2px solid transparent; white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--navy); font-weight:700}
.tab:focus-visible{outline:2px solid var(--navy); outline-offset:-2px}

section.view{display:none; animation:fade .18s ease-out}
section.view.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Bausteine ---------- */
h2.sec{
  font-family:'Fraunces',serif; font-weight:600; font-size:24px; letter-spacing:-.01em;
  margin:32px 0 4px;
}
h2.sec:first-child{margin-top:4px}
.sec-note{color:var(--muted); font-size:13px; margin:0 0 16px}
h3{font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin:22px 0 6px}
p{margin:0 0 12px}
ul{margin:0 0 12px; padding-left:18px}
li{margin-bottom:5px}
strong{font-weight:600}
code{font-family:var(--mono); font-size:12.5px; background:var(--rule-soft); padding:1px 5px; border-radius:3px}
.eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); margin-bottom:6px;
}
.card{
  background:var(--paper-2); border:1px solid var(--rule); border-radius:2px;
  padding:16px 16px 14px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card.tight{padding:12px 14px}
.callout{border-left:3px solid var(--navy); background:var(--paper-2); padding:12px 14px; margin:14px 0; font-size:14px}
.callout.warn{border-left-color:var(--bear)}
.callout.win{border-left-color:var(--bull)}
.callout .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:4px}

/* Datenzeile: Signature-Element */
.wire{
  border-top:1.5px solid var(--ink); border-bottom:1px solid var(--rule);
  display:grid; grid-template-columns:repeat(3,1fr); font-family:var(--mono);
  margin:10px 0 12px;
}
.wire div{padding:8px 10px; border-right:1px solid var(--rule-soft)}
.wire div:last-child{border-right:0}
.wire .k{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block}
.wire .v{font-size:14px; font-weight:700}
.impact{display:inline-flex; gap:3px; vertical-align:middle; margin-left:6px}
.impact i{width:6px; height:6px; border-radius:50%; background:var(--rule); display:block}
.impact i.on{background:var(--bear)}

table{width:100%; border-collapse:collapse; font-size:13.5px; margin:0 0 14px}
th,td{text-align:left; padding:8px 8px 8px 0; border-bottom:1px solid var(--rule-soft); vertical-align:top}
th{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500}
td.num{font-family:var(--mono); text-align:right; padding-right:0}

.pill{
  display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 7px; border:1px solid var(--rule); border-radius:2px; color:var(--muted);
}
.pill.bull{color:var(--bull); border-color:var(--bull)}
.pill.bear{color:var(--bear); border-color:var(--bear)}
.pill.navy{color:var(--navy); border-color:var(--navy)}
.pill.amber{color:var(--amber); border-color:var(--amber)}

button.act{
  appearance:none; cursor:pointer; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em;
  text-transform:uppercase; background:var(--ink); color:var(--paper); border:1px solid var(--ink);
  padding:10px 14px; border-radius:2px;
}
button.act.ghost{background:none; color:var(--ink)}
button.act:disabled{opacity:.4; cursor:default}
button.act:focus-visible{outline:2px solid var(--navy); outline-offset:2px}

input[type=number],input[type=text],select{
  font-family:var(--mono); font-size:14px; background:var(--paper-2); color:var(--ink);
  border:1px solid var(--rule); border-radius:2px; padding:9px 10px; width:100%;
}
input:focus,select:focus{outline:2px solid var(--navy); outline-offset:-1px}
label.fl{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:4px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}

details.mod{border:1px solid var(--rule); background:var(--paper-2); border-radius:2px; margin-bottom:10px}
details.mod summary{
  cursor:pointer; padding:13px 14px; list-style:none; display:flex; align-items:baseline; gap:10px;
  font-family:'Fraunces',serif; font-size:16.5px; font-weight:600;
}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary .idx{font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:400}
details.mod[open] summary{border-bottom:1px solid var(--rule-soft)}
details.mod .body{padding:14px 14px 4px}
.done-dot{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--bull)}

.search{margin-bottom:14px}
.filterrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.chip{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--rule); background:var(--paper-2); padding:6px 9px; border-radius:2px;
  cursor:pointer; color:var(--muted);
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}

.opt{
  display:block; width:100%; text-align:left; background:var(--paper-2); border:1px solid var(--rule);
  border-radius:2px; padding:11px 12px; margin-bottom:8px; cursor:pointer; font:inherit; font-size:14px; color:var(--ink);
}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--bull); background:rgba(46,107,79,.07)}
.opt.wrong{border-color:var(--bear); background:rgba(163,59,50,.07)}
.opt:disabled{cursor:default}

.scorebar{display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:12px}
.prog{height:3px; background:var(--rule-soft); margin-bottom:16px}
.prog i{display:block; height:100%; background:var(--navy); width:0%; transition:width .3s}

canvas{width:100%; height:auto; display:block}
.foot{border-top:1px solid var(--rule); margin-top:40px; padding:16px 0 30px; color:var(--muted); font-size:12px; font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="kicker"><span>Makro · News · Positionierung</span><span id="hdrDate"></span></div>
  <h1>Makro &amp; COT Lab</h1>
  <p>Wie Zahlen, Zentralbanken und Positionierung den Index-Future bewegen — und wie du eine Meldung in Sekunden einordnest, statt sie zu handeln.</p>
</header>

<nav class="tabs" aria-label="Bereiche">
  <div class="tabrow" id="tabrow"></div>
</nav>

<section class="view" id="v-motor"></section>
<section class="view" id="v-indi"></section>
<section class="view" id="v-lesen"></section>
<section class="view" id="v-news"></section>
<section class="view" id="v-cot"></section>
<section class="view" id="v-rechner"></section>
<section class="view" id="v-trainer"></section>
<section class="view" id="v-quiz"></section>
<section class="view" id="v-routine"></section>
<section class="view" id="v-playbook"></section>

<div class="foot">
  Lokal gespeichert · kein Server · <span id="resetLink" style="cursor:pointer; text-decoration:underline">Fortschritt zurücksetzen</span>
</div>
</div>
<script>
/* ============================================================
   STATE
   ============================================================ */
const KEY='makro_cot_lab_v1';
let S = JSON.parse(localStorage.getItem(KEY) || '{}');
S.read = S.read || {};        // gelesene Module
S.quiz = S.quiz || {best:0, runs:0};
S.train = S.train || {right:0, total:0};
S.cot  = S.cot  || {rows:[]}; // COT-Historie
const save = ()=>localStorage.setItem(KEY, JSON.stringify(S));
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

document.getElementById('hdrDate').textContent =
  new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});

/* ============================================================
   1) MAKRO-MOTOR
   ============================================================ */
const MOTOR = [
{t:'Was den Index-Future überhaupt bewegt', b:`
<p>Ein Aktienindex ist nichts anderes als <em>erwartete künftige Gewinne, abgezinst mit einem Zins, korrigiert um eine Risikoprämie</em>. Alle drei Größen ändern sich mit Makrodaten — deshalb reagiert der NQ auf Zahlen, die mit Tech-Unternehmen scheinbar nichts zu tun haben.</p>
<table>
<tr><th>Kanal</th><th>Was sich ändert</th><th>Wirkung auf NQ</th></tr>
<tr><td>Diskontierung</td><td>Realzins, 10y-Rendite, Terminal Rate</td><td>Der stärkste Hebel. Lange Duration = Wachstumsaktien reagieren überproportional auf Zinsen.</td></tr>
<tr><td>Gewinne</td><td>Nominales Wachstum, Margen, Konsum</td><td>Gute Konjunktur = höhere Gewinne, aber nur wenn keine Zinsreaktion folgt.</td></tr>
<tr><td>Risikoprämie</td><td>Unsicherheit, Kredit-Spreads, Vol</td><td>Krisen, Geopolitik, Bankenstress: Multiple fällt, unabhängig von Gewinnen.</td></tr>
<tr><td>Liquidität</td><td>Bilanz der Fed, Reserven, TGA, RRP</td><td>Langsam wirkend, erklärt Trends über Wochen bis Quartale, nicht die Reaktion um 14:30.</td></tr>
</table>
<div class="callout"><span class="lbl">Kern</span>Der NQ ist der zinssensitivste der großen US-Index-Futures. Wenn du zwischen ES und NQ wählst: dieselbe Nachricht bewegt NQ typischerweise stärker, weil Duration und Gewichtung der Mega-Caps hebeln.</div>`},

{t:'Wachstum × Inflation: die vier Quadranten', b:`
<p>Ordne jede Zahl, die reinkommt, in ein 2×2-Raster ein. Das ist die schnellste Art, aus einem Datenpunkt eine Erwartung zu machen.</p>
<table>
<tr><th></th><th>Inflation fällt</th><th>Inflation steigt</th></tr>
<tr><td><strong>Wachstum steigt</strong></td><td><span class="pill bull">Goldilocks</span> Bestes Umfeld für Aktien. Gewinne hoch, Zinsdruck runter.</td><td><span class="pill amber">Überhitzung</span> Aktien laufen, bis der Markt die Fed einpreist. Kippt oft abrupt.</td></tr>
<tr><td><strong>Wachstum fällt</strong></td><td><span class="pill navy">Disinflationärer Abschwung</span> Anleihen steigen, Aktien uneindeutig: Zinsentlastung vs. Gewinnsorgen.</td><td><span class="pill bear">Stagflation</span> Schlechtestes Umfeld. Keine Rettung durch die Fed.</td></tr>
</table>
<h3>Warum dieselbe Zahl mal gut und mal schlecht ist</h3>
<p>Der Markt hat eine <strong>Reaktionsfunktion</strong>, und die wechselt in Regimen:</p>
<ul>
<li><strong>Inflations-Regime</strong> („good news is bad news"): Starke Arbeitsmarktdaten drücken Aktien, weil sie höhere Zinsen bedeuten. Typisch 2022–2023.</li>
<li><strong>Wachstums-Regime</strong> („good news is good news"): Starke Daten heben Aktien, weil eine Rezession vom Tisch ist. Typisch in Abkühlungsphasen mit bereits gefallener Inflation.</li>
</ul>
<p>Erkennen kannst du das Regime an einer einzigen Beobachtung: <strong>Wie korrelieren Anleihen und Aktien heute?</strong> Fallen Kurse von Anleihen und Aktien gemeinsam bei starken Daten, bist du im Inflations-Regime. Steigen Aktien während Renditen steigen, dominiert Wachstum.</p>
<div class="callout warn"><span class="lbl">Häufigster Fehler</span>Die Reaktionsfunktion aus dem letzten Jahr auf die heutige Zahl anwenden. Prüfe das Regime, bevor du eine Richtung ableitest — nicht danach.</div>`},

{t:'Die Fed als eigentlicher Gegenspieler', b:`
<p>Zwischen den Sitzungen handelt der Markt nicht die Fed, sondern <strong>Erwartungen an die Fed</strong>. Diese Erwartungen stehen in den Fed-Funds-Futures und in SOFR-Futures und lassen sich als implizite Wahrscheinlichkeiten lesen (CME FedWatch).</p>
<h3>Das Mandat</h3>
<ul>
<li><strong>Preisstabilität</strong>: Ziel 2 % gemessen am <em>Core PCE</em> — nicht am CPI. Der CPI bewegt den Markt trotzdem stärker, weil er früher kommt.</li>
<li><strong>Maximale Beschäftigung</strong>: Arbeitslosenquote, Partizipation, Lohnwachstum.</li>
</ul>
<h3>Was du vor jeder Zahl wissen musst</h3>
<ul>
<li>Wie viele Zinsschritte sind bis Jahresende eingepreist?</li>
<li>Welche der beiden Mandatshälften dominiert gerade die Rhetorik?</li>
<li>Wo steht die 2-jährige Rendite? Sie ist die reinste Fed-Erwartung. Bewegt sich der 2y-Yield nach einer Zahl kaum, war die Zahl für die Fed irrelevant — egal wie laut die Schlagzeile war.</li>
</ul>
<div class="callout"><span class="lbl">Praktisch</span>Nutze den 2-Jahres-Yield als Bestätigungsinstrument. Reaktion im NQ ohne Reaktion im 2y ist meist Positionierungs-Rauschen und läuft öfter zurück.</div>`},

{t:'Liquidität und Angebot: der langsame Strom', b:`
<p>Diese Faktoren erklären keine 5-Minuten-Kerze, aber sie erklären, warum Rücksetzer wochenlang gekauft oder verkauft werden.</p>
<ul>
<li><strong>QT / QE</strong>: Schrumpft die Fed-Bilanz, verschwinden Reserven aus dem System. Wirkt wie ein dauerhafter Gegenwind.</li>
<li><strong>TGA</strong> (Konto des US-Finanzministeriums bei der Fed): Füllt es sich, wird dem Markt Liquidität entzogen. Leert es sich, fließt sie zurück.</li>
<li><strong>Refunding-Ankündigungen</strong>: Wie viel Anleihe-Emission kommt, und vor allem am kurzen oder langen Ende? Viel Langläufer-Angebot drückt Kurse, hebt Renditen, belastet Duration und damit den NQ.</li>
<li><strong>Auktionen</strong> (v. a. 10y und 30y, meist 13:00 ET): Schwache Auktion → Renditen springen → NQ oft sofort schwächer. Ein unterschätzter Intraday-Katalysator am Nachmittag.</li>
</ul>`},

{t:'Vom Makro zum Trade: was davon überhaupt handelbar ist', b:`
<p>Ehrliche Einordnung, bevor du Zeit investierst:</p>
<table>
<tr><th>Ebene</th><th>Horizont</th><th>Nutzen für dich</th></tr>
<tr><td>Liquidität, Fiskalpolitik</td><td>Monate</td><td>Bias, Größe der Rücksetzer, Erwartung an Trendtage</td></tr>
<tr><td>Regime (Wachstum vs. Inflation)</td><td>Wochen</td><td>Richtung der Reaktionsfunktion — welche Zahl gut oder schlecht ist</td></tr>
<tr><td>Positionierung (COT, Optionen)</td><td>Tage bis Wochen</td><td>Wie voll ist der Trade? Wo liegt das Squeeze-Risiko?</td></tr>
<tr><td>Einzelne Datenveröffentlichung</td><td>Minuten bis Stunden</td><td>Volatilitätsfenster, Levels werden getestet, Regimewechsel im Tageschart</td></tr>
</table>
<div class="callout win"><span class="lbl">Die nützlichste Übersetzung</span>Makro sagt dir nicht, wo du einsteigst. Es sagt dir, <strong>ob heute ein Tag ist, an dem Levels halten oder brechen</strong> — und genau das ist die Frage, die dein Regime-Ansatz ohnehin stellt. Ein High-Impact-Release ist strukturell ein Breakout-Katalysator: er liefert genau die Information, die vorher nicht im Preis stand.</div>`}
];

/* ============================================================
   2) INDIKATOREN-DATENBANK
   ============================================================ */
const IND = [
{n:'CPI — Verbraucherpreise', cat:'Inflation', imp:5, src:'BLS', when:'ca. 10.–15. des Folgemonats, 8:30 ET (14:30 dt.)',
 what:'Preisentwicklung eines Warenkorbs der Haushalte. Headline inkl. Energie/Nahrung, Core ohne beides.',
 look:'Core MoM auf zwei Nachkommastellen. Der Markt handelt die Abweichung im Kern, nicht die Schlagzeile. Danach: Supercore (Dienstleistungen ohne Wohnen) und Shelter, weil Shelter mit Verzögerung reagiert und den Kern künstlich hochhält.',
 react:'Core über Konsens → Renditen hoch, NQ runter. Unter Konsens → Erleichterungsrally. Die erste Bewegung ist oft algorithmisch und wird in den ersten 10–20 Minuten mindestens einmal getestet.',
 trap:'Rundung. 0,349 wird als 0,3 gedruckt, 0,351 als 0,4 — bei identischer Inflation. Und: Der Markt handelt zuerst die Zeile, dann die Zusammensetzung. Rückläufe nach 15 Minuten sind normal, keine Manipulation.'},

{n:'Core PCE — Preisindex der Konsumausgaben', cat:'Inflation', imp:4, src:'BEA', when:'Ende des Monats, 8:30 ET',
 what:'Das offizielle Inflationsziel der Fed. Anderer Warenkorb als CPI, Gewichtung passt sich dem Konsumverhalten an, Gesundheitskosten stärker gewichtet.',
 look:'Core MoM und die annualisierte 3-Monats-Rate. Letztere zeigt den Trend, bevor die Jahresrate ihn zeigt.',
 react:'Meist gedämpft, weil CPI und PPI vorher veröffentlicht wurden und Analysten PCE daraus weitgehend errechnen können. Große Überraschungen sind selten — genau deshalb bewegen sie umso mehr.',
 trap:'PCE als „wichtigste Zahl" zu überschätzen, weil die Fed sie nutzt. Für den Intraday-Impact ist der CPI klar wichtiger.'},

{n:'PPI — Erzeugerpreise', cat:'Inflation', imp:3, src:'BLS', when:'meist am Tag vor oder nach dem CPI, 8:30 ET',
 what:'Preise auf Produzentenebene, vorgelagert zum Konsumenten.',
 look:'Die Teilkomponenten, die direkt in den PCE einfließen (Portfoliomanagement-Gebühren, Gesundheitsleistungen, Flugtickets). Analysten aktualisieren danach ihre PCE-Schätzung.',
 react:'Für sich genommen moderat. Wichtig als Vorlauf: Ein starker PPI kann die CPI-Erwartung verschieben und einen Teil der Bewegung vorwegnehmen.',
 trap:'Headline-PPI ist volatil durch Energie und Handelsspannen. Ohne Blick auf die PCE-relevanten Zeilen ist die Zahl fast nutzlos.'},

{n:'Nonfarm Payrolls (Arbeitsmarktbericht)', cat:'Arbeitsmarkt', imp:5, src:'BLS', when:'in der Regel erster Freitag im Monat, 8:30 ET',
 what:'Beschäftigungsaufbau außerhalb der Landwirtschaft, plus Arbeitslosenquote, Stundenlöhne, Partizipation und Wochenstunden.',
 look:'Drei Zahlen gleichzeitig: (1) Payrolls inkl. <strong>Revisionen der beiden Vormonate</strong>, (2) Arbeitslosenquote auf eine Nachkommastelle, (3) Average Hourly Earnings MoM. Widersprechen sie sich, gewinnt bei Inflationsangst der Lohn, bei Rezessionsangst die Quote.',
 react:'Der volatilste Release des Monats neben dem CPI. Erwarte eine Ausdehnung der Range in den ersten Minuten, häufig gefolgt von einem vollständigen Rücklauf, sobald die Details gelesen sind.',
 trap:'Zwei Umfragen, ein Bericht: Die Payrolls kommen aus der Betriebsumfrage, die Arbeitslosenquote aus der Haushaltsumfrage. Sie können systematisch auseinanderlaufen. Große Abwärtsrevisionen entwerten eine starke Kopfzahl komplett.'},

{n:'Initial Jobless Claims', cat:'Arbeitsmarkt', imp:3, src:'DOL', when:'jeden Donnerstag, 8:30 ET',
 what:'Erstanträge auf Arbeitslosenhilfe. Der aktuellste Arbeitsmarktindikator überhaupt.',

<p>Eine Inflation von 3 % ist weder gut noch schlecht. Entscheidend ist die Differenz zu dem, was vorher im Preis stand. Diese Differenz hat drei Ebenen:</p>
<ul>
<li><strong>Konsens</strong>: Median der Analystenschätzungen. Steht in jedem Kalender.</li>
<li><strong>Whisper</strong>: Was Marktteilnehmer tatsächlich erwarten, oft abweichend vom Konsens, weil vorlaufende Daten schon etwas anderes andeuteten.</li>
<li><strong>Positionierung</strong>: Wonach die Leute bereits positioniert sind. Bei einseitiger Positionierung reicht ein Treffer auf Konsens für eine heftige Bewegung, weil niemand mehr kaufen muss.</li>
</ul>
<div class="callout"><span class="lbl">Merksatz</span>Bewegung = Überraschung × Positionierung × Regime-Empfindlichkeit. Fehlt einer der drei Faktoren, passiert wenig — auch bei „großer" Nachricht.</div>
<h3>Die Streuung der Schätzungen zählt</h3>
<p>Liegen alle Analysten in einer engen Spanne, ist die Zahl gut prognostizierbar und eine Abweichung wiegt schwer. Ist die Spanne breit (typisch bei NFP), ist eine „Abweichung" vom Median oft nur statistisches Rauschen.</p>`},

<p><code>(1 + MoM)^12 − 1</code>. Faustregel: 0,2 % MoM entspricht rund 2,4 % im Jahr — also Zielerreichung. 0,4 % MoM sind knapp 5 % — also klar zu heiß. Damit kannst du jede CPI-Zahl in drei Sekunden gegen das Fed-Ziel prüfen.</p>`},

{t:'Legacy: Non-Commercial vs. Commercial richtig verstehen', b:`
<h3>Non-Commercial</h3>
<p>Große Marktteilnehmer <em>ohne</em> zugrundeliegendes Absicherungsgeschäft — im Kern spekulative Fonds. Sie sind typischerweise <strong>trendfolgend</strong>: Ihre Netto-Position wächst, während ein Trend läuft, und erreicht ihr Maximum oft nahe der Wende. Deshalb gelten Non-Commercials als „falsch an den Extremen" — nicht weil sie schlecht wären, sondern weil ihr Stil sie dorthin führt.</p>
<h3>Commercial</h3>
<p>Teilnehmer mit Absicherungsbedarf im Basiswert. Sie sind <strong>preisunelastisch und antizyklisch</strong>: Sie verkaufen in steigende Märkte und kaufen in fallende, weil sie Bestände hedgen und nicht auf Richtung wetten.</p>
<div class="callout warn"><span class="lbl">Der große Irrtum</span>„Commercials sind das Smart Money." Bei Rohstoffen steckt dahinter ein Produzent mit Marktkenntnis. Bei <strong>Aktienindex-Futures</strong> ist der „Commercial" überwiegend ein Händler der Sell-Side, der Kundenpositionen und Optionsbücher absichert. Seine Netto-Short-Position ist damit vor allem ein <em>Spiegelbild der Kundennachfrage</em> — kein Marktausblick. Wer die Netto-Short der Commercials im ES als Bärensignal liest, liest sein eigenes Bild verkehrt herum.</div>
<h3>Non-Reportable</h3>
<p>Alles unterhalb der Meldeschwelle, rechnerischer Rest. Wird gern als „dumb money" bezeichnet; für Indexfutures ist die Aussagekraft gering, weil dieser Anteil klein ist.</p>`},

{t:'Rechnen: Netto-Position, Veränderung, COT-Index', b:`
<h3>Netto-Position</h3>
<p><code>Netto = Long − Short</code> je Gruppe. Die Summe aller Netto-Positionen ist immer null: Jeder Kontrakt hat einen Käufer und einen Verkäufer. Deshalb ist die Aussage „alle sind long" strukturell unmöglich — jemand hält die Gegenseite.</p>
<h3>Wochenveränderung</h3>
<p>Oft aussagekräftiger als der Absolutwert. Eine Veränderung von +40.000 Kontrakten in einer Woche zeigt, dass eine Gruppe aktiv umgeschichtet hat.</p>
<h3>COT-Index (nach Williams)</h3>
<p>Normiert die Netto-Position auf ihr eigenes historisches Band:</p>
<p><code>Index = (Netto_aktuell − Netto_min) / (Netto_max − Netto_min) × 100</code></p>
<p>über ein Fenster von typischerweise 26, 52 oder 156 Wochen. Damit werden Märkte und Zeiträume vergleichbar.</p>
<table>
<tr><th>Wert</th><th>Bedeutung</th></tr>
<tr><td>über 80</td><td>Gruppe ist historisch stark long positioniert</td></tr>
<tr><td>20–80</td><td>neutral, kein Extremwert</td></tr>
<tr><td>unter 20</td><td>historisch stark short positioniert</td></tr>
</table>
<p>Ein Extremwert ist eine Kontext-Information, kein Auftrag. Er verändert die Wahrscheinlichkeitsverteilung der Bewegungsgröße, nicht die Richtung des nächsten Tages.</p>`},

{t:'Open Interest und Preis kombiniert', b:`
<p>Das Open Interest zeigt die Zahl offener Kontrakte insgesamt. Zusammen mit dem Preis ergibt sich eine klassische Vier-Felder-Deutung:</p>
<table>
<tr><th>Preis</th><th>Open Interest</th><th>Deutung</th></tr>
<tr><td>steigt</td><td>steigt</td><td>neues Geld auf der Long-Seite — Trend ist getragen</td></tr>
<tr><td>steigt</td><td>fällt</td><td>Short-Eindeckungen — Rally auf Zeit, oft ohne Fortsetzung</td></tr>
<tr><td>fällt</td><td>steigt</td><td>neue Shorts — Abwärtstrend ist getragen</td></tr>
<tr><td>fällt</td><td>fällt</td><td>Long-Auflösung — Verkaufsdruck lässt nach</td></tr>
</table>
<div class="callout warn"><span class="lbl">Verzerrung</span>Rund um Rolltermine und Quartalsverfälle steigt und fällt das Open Interest aus rein technischen Gründen. In diesen Wochen ist die Deutung wertlos.</div>`},

{t:'COT im Ablauf: eine Routine, die 10 Minuten dauert', b:`
<ol>

<p>Übersetzung von Makro in deine bestehende Regime-Logik:</p>

  TABS.forEach(([t])=>{

/* --- Modul-Renderer (aufklappbar, mit Gelesen-Markierung) --- */
function modules(list, key, host, head){
  let h = head || '';
  list.forEach((m,i)=>{
    const id=key+i, done=!!S.read[id];
    h+=`<details class="mod" data-id="${id}">
      <summary><span class="idx">${String(i+1).padStart(2,'0')}</span><span>${m.t}</span>
      <span class="done-dot">${done?'gelesen':''}</span></summary>
      <div class="body">${m.b}
      <p style="margin-top:10px"><button class="act ghost" data-mark="${id}">${done?'Markierung entfernen':'Als gelesen markieren'}</button></p>
      </div></details>`;
  });
  host.innerHTML=h;
  host.querySelectorAll('[data-mark]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.mark;
      S.read[id]=!S.read[id]; save();
      b.textContent = S.read[id]?'Markierung entfernen':'Als gelesen markieren';
      host.querySelector('details[data-id="'+id+'"] .done-dot').textContent = S.read[id]?'gelesen':'';
    };
  });
}

const CATS=[...new Set(IND.map(i=>i.cat))];
let indFilter='alle', indQuery='';
function renderInd(){
  const host=$('#v-indi');
  let h=`<h2 class="sec">Indikatoren</h2><p class="sec-note">Für jeden Release: die Zeile, auf die es ankommt — und die typische Falle.</p>
  <div class="search"><input type="text" id="indSearch" placeholder="Suchen: CPI, ISM, Auktion …" value="${esc(indQuery)}"></div>
  <div class="filterrow"><button class="chip" data-c="alle" aria-pressed="${indFilter==='alle'}">Alle</button>`;
  CATS.forEach(c=>h+=`<button class="chip" data-c="${c}" aria-pressed="${indFilter===c}">${c}</button>`);
  h+='</div>';
  const q=indQuery.toLowerCase();
  const rows=IND.filter(i=>(indFilter==='alle'||i.cat===indFilter) &&
      (!q || (i.n+i.what+i.look+i.cat).toLowerCase().includes(q)));
  if(!rows.length) h+='<div class="card">Kein Treffer. Suchbegriff ändern oder Filter auf „Alle" stellen.</div>';
  rows.forEach(i=>{
    let dots=''; for(let k=1;k<=5;k++) dots+=`<i class="${k<=i.imp?'on':''}"></i>`;
    h+=`<div class="card">
      <div class="eyebrow">${i.cat} · ${i.src}</div>
      <h3 style="margin:0 0 2px">${i.n}<span class="impact" title="Impact ${i.imp}/5">${dots}</span></h3>
      <div class="wire" style="grid-template-columns:1fr">
        <div><span class="k">Termin</span><span class="v" style="font-size:12.5px">${i.when}</span></div>
      </div>
      <p><strong>Was gemessen wird.</strong> ${i.what}</p>
      <p><strong>Worauf du schaust.</strong> ${i.look}</p>
      <p><strong>Typische Reaktion.</strong> ${i.react}</p>
      <p style="margin-bottom:2px"><strong>Falle.</strong> ${i.trap}</p>
    </div>`;
  });
  host.innerHTML=h;
  host.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{indFilter=c.dataset.c; renderInd();});
  const inp=host.querySelector('#indSearch');
  inp.oninput=e=>{indQuery=e.target.value; renderInd(); const n=$('#v-indi #indSearch'); n.focus(); n.setSelectionRange(n.value.length,n.value.length);};
}

let qIdx=0, qScore=0, qAnswered=false, qOrder=[];
function shuffle(a){a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function startQuiz(){ qOrder=shuffle(QUIZ.map((_,i)=>i)).slice(0,20); qIdx=0; qScore=0; qAnswered=false; renderQuiz(); }
function renderQuiz(){
  const host=$('#v-quiz');
  if(qIdx>=qOrder.length){
    const pct=Math.round(qScore/qOrder.length*100);
    S.quiz.runs++; if(pct>S.quiz.best) S.quiz.best=pct; save();
    host.innerHTML=`<h2 class="sec">Quiz</h2>
      <div class="card"><div class="eyebrow">Durchgang beendet</div>
      <h3 style="margin-top:0">${qScore} von ${qOrder.length} richtig — ${pct} %</h3>
      <p>Bestwert ${S.quiz.best} % · ${S.quiz.runs} Durchgänge.</p>
      <p>${pct>=85?'Sitzt. Nimm dir den Trainer vor, dort geht es um Anwendung statt Definitionen.':pct>=60?'Solide Basis. Die Fehlbereiche findest du am schnellsten in „Daten lesen" und „COT".':'Geh die Module noch einmal durch — vor allem Makro-Motor und COT.'}</p>
      <button class="act" id="qAgain">Neuer Durchgang</button></div>`;
    host.querySelector('#qAgain').onclick=startQuiz; return;
  }
  const q=QUIZ[qOrder[qIdx]];
  host.innerHTML=`<h2 class="sec">Quiz</h2><p class="sec-note">20 zufällige Fragen aus ${QUIZ.length}. Bestwert ${S.quiz.best} %.</p>
    <div class="scorebar"><span>Frage ${qIdx+1} / ${qOrder.length}</span><span>${qScore} richtig</span></div>
    <div class="prog"><i style="width:${qIdx/qOrder.length*100}%"></i></div>
    <div class="card"><p style="font-weight:600; font-size:15.5px">${q.q}</p><div id="qOpts"></div><div id="qExp"></div></div>`;
  const box=host.querySelector('#qOpts');
  q.o.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      if(qAnswered) return; qAnswered=true;
      if(i===q.a) qScore++;
      [...box.children].forEach((el,j)=>{el.disabled=true; if(j===q.a) el.classList.add('right'); else if(j===i) el.classList.add('wrong');});
      host.querySelector('#qExp').innerHTML=`<div class="callout ${i===q.a?'win':'warn'}"><span class="lbl">${i===q.a?'Richtig':'Falsch'}</span>${q.e}</div>
        <button class="act" id="qNext">Weiter</button>`;
      host.querySelector('#qNext').onclick=()=>{qIdx++; qAnswered=false; renderQuiz();};
    };
    box.appendChild(b);
  });
}

/* --- Feldnamen der CFTC-API sind uneinheitlich (_all / ohne Suffix).
       Deshalb tolerant auflösen statt hart verdrahten. --- */
function pickNum(row, base){
  let v = row[base+'_all'];
  if(v===undefined) v = row[base];
  if(v===undefined){
    const k = Object.keys(row).find(k=>k.startsWith(base) && !/_(old|other|1|2)$/.test(k));
    if(k) v = row[k];
  }
  if(v===undefined || v===null || v==='') return null;
  const n = +String(v).replace(/,/g,'');
  return Number.isFinite(n) ? n : null;
}

function series(m,g){
  return S.cot.rows.filter(r=>r.g===g && r.m===m).sort((a,b)=>a.d.localeCompare(b.d))
    .map(r=>({...r, net:r.l-r.s}));
}
function cotIndex(arr, win){
  if(arr.length<2) return null;
  const w=arr.slice(-win); const nets=w.map(x=>x.net);
  const mn=Math.min(...nets), mx=Math.max(...nets);
  if(mx===mn) return null;
  return Math.round((nets[nets.length-1]-mn)/(mx-mn)*100);
}
const fmt=n=>Number(n).toLocaleString('de-DE');
const sig=n=>(n>0?'+':'')+fmt(n);

/* ============================================================
   CFTC-Import (Socrata / Public Reporting Environment)
   ============================================================ */
async function fetchCFTC(src, code, weeks){
  const url='https://publicreporting.cftc.gov/resource/'+SODA[src]+'.json'
    +'?$where='+encodeURIComponent("cftc_contract_market_code='"+code+"'")
    +'&$order='+encodeURIComponent('report_date_as_yyyy_mm_dd DESC')
    +'&$limit='+weeks;
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('HTTP '+r.status+' ('+src+')');
  const j=await r.json();
  if(!Array.isArray(j)) throw new Error('Unerwartetes Format ('+src+')');
  return j;
}

async function importCFTC(weeks, log){
  let added=0, updated=0, skipped=0;
  const idx=new Map(S.cot.rows.map(r=>[r.m+'|'+r.g+'|'+r.d, r]));
  for(const m of MKT){
    for(const src of ['legacy','tff']){
      log(m.k+' · '+(src==='tff'?'TFF (Dealer/AM/Lev Funds)':'Legacy (Non-Comm/Comm)')+' wird geladen …');
      const raws=await fetchCFTC(src, m.code, weeks);
      if(!raws.length){ log('⚠︎ '+m.k+' · '+src+': keine Zeilen zurückgeliefert.'); continue; }
      const groups=GRPDEF.filter(x=>x.src===src);
      for(const raw of raws){
        const d=String(raw.report_date_as_yyyy_mm_dd||'').slice(0,10);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ skipped++; continue; }
        const oi=pickNum(raw,'open_interest');
        for(const gd of groups){
          const l=pickNum(raw,gd.lb), s=pickNum(raw,gd.sb);
          if(l===null||s===null){ skipped++; continue; }
          const key=m.k+'|'+gd.g+'|'+d, ex=idx.get(key);
          if(ex){
            if(ex.l!==l||ex.s!==s||ex.oi!==oi){ ex.l=l; ex.s=s; ex.oi=oi; ex.src='cftc'; updated++; }
          }else{
            const row={id:key, m:m.k, g:gd.g, d, l, s, oi, src:'cftc'};
            S.cot.rows.push(row); idx.set(key,row); added++;
          }
        }
      }
      log('✓ '+m.k+' · '+src+': '+raws.length+' Stichtage verarbeitet.');
    }
  }
  save();
  return {added, updated, skipped};
}

  sel('#vM').onchange=e=>{calcMkt=e.target.value; localStorage.setItem('cot_mkt',calcMkt); renderCalc();};

  host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{

  if(sel('#delMkt')) sel('#delMkt').onclick=()=>{

      S.cot.rows=S.cot.rows.filter(r=>r.m!==calcMkt); save(); renderCalc();

  if(sel('#expCsv')) sel('#expCsv').onclick=()=>{

    const body=S.cot.rows.slice().sort((a,b)=>(a.m+a.g+a.d).localeCompare(b.m+b.g+b.d))
      .map(r=>[r.m,r.g,r.d,r.l,r.s,r.l-r.s,r.oi??''].join(';')).join('\n');
    const blob=new Blob([head+'\n'+body],{type:'text/csv;charset=utf-8'});

  sel('#qCalc').onclick=()=>{
    const n=+sel('#qN').value, mn=+sel('#qMin').value, mx=+sel('#qMax').value;
    const out=sel('#qOut');
    if(mx===mn){out.textContent='Min und Max dürfen nicht gleich sein.'; return;}
    const v=Math.round((n-mn)/(mx-mn)*100);
    out.textContent=`COT-Index = ${v} — ${v>=80?'oberes Extrem':v<=20?'unteres Extrem':'neutrale Zone'}`;
  };
  sel('#aCalc').onclick=()=>{
    const m=parseFloat(String(sel('#aM').value).replace(',','.'));
    const out=sel('#aOut');
    if(!Number.isFinite(m)){out.textContent='Monatsrate eintragen, z. B. 0,3'; return;}
    const a=(Math.pow(1+m/100,12)-1)*100;
    out.textContent=`${m.toFixed(2).replace('.',',')} % pro Monat = ${a.toFixed(1).replace('.',',')} % annualisiert  ·  Fed-Ziel liegt bei 2 %`;
  };
  drawChart();
}

/* ============================================================
   Charts
   ============================================================ */
function drawChart(){
  const arrAll=series(calcMkt,calcGrp);
  const arr=arrAll.slice(-Math.max(calcWin,8));
  const cv=document.getElementById('cotChart');
  if(cv && arr.length>=2){
    const ctx=cv.getContext&&cv.getContext('2d');
    if(ctx){
      const W=cv.width, H=cv.height, pad=46;
      ctx.clearRect(0,0,W,H);
      const nets=arr.map(a=>a.net);
      let mn=Math.min(...nets,0), mx=Math.max(...nets,0);
      const span=(mx-mn)||1; mn-=span*.1; mx+=span*.1;
      const x=i=>pad+ i*(W-pad-8)/(arr.length-1);
      const y=v=>H-20-((v-mn)/(mx-mn))*(H-38);
      ctx.setLineDash([4,4]); ctx.strokeStyle='#C9C0AE'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(pad,y(0)); ctx.lineTo(W-8,y(0)); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle='#1F3A5F'; ctx.lineWidth=2; ctx.beginPath();
      arr.forEach((a,i)=>{ i?ctx.lineTo(x(i),y(a.net)):ctx.moveTo(x(i),y(a.net)); }); ctx.stroke();
      const lastNet=arr[arr.length-1].net;
      ctx.fillStyle= lastNet>=0 ? '#2E6B4F' : '#A33B32';
      ctx.beginPath(); ctx.arc(x(arr.length-1), y(lastNet), 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#6E675C'; ctx.font='11px JetBrains Mono, monospace';
      ctx.fillText(fmt(Math.round(mx)), 2, 14);
      ctx.fillText(fmt(Math.round(mn)), 2, H-6);
      ctx.fillText(arr[0].d, pad, H-4);
      ctx.fillText(arr[arr.length-1].d, W-78, H-4);
    }
  }

  const cv2=document.getElementById('idxChart');
  if(cv2 && arrAll.length>=4){
    const ctx=cv2.getContext&&cv2.getContext('2d');
    if(ctx){
      const W=cv2.width, H=cv2.height, pad=46, top=12, bot=18;
      ctx.clearRect(0,0,W,H);
      /* rollierender Index über die letzten min(calcWin, len) Punkte */
      const pts=[];
      for(let i=0;i<arrAll.length;i++){
        const w=arrAll.slice(Math.max(0,i-calcWin+1), i+1);
        if(w.length<4){ pts.push(null); continue; }
        const nets=w.map(z=>z.net), mn=Math.min(...nets), mx=Math.max(...nets);
        pts.push(mx===mn?null:Math.round((nets[nets.length-1]-mn)/(mx-mn)*100));
      }
      const show=pts.slice(-Math.max(calcWin,8));
      const x=i=>pad+ i*(W-pad-8)/Math.max(1,(show.length-1));
      const y=v=>H-bot-(v/100)*(H-top-bot);
      [20,80].forEach(lvl=>{
        ctx.setLineDash([3,4]); ctx.strokeStyle= lvl===80?'#2E6B4F':'#A33B32'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(pad,y(lvl)); ctx.lineTo(W-8,y(lvl)); ctx.stroke(); ctx.setLineDash([]);
      });
      ctx.strokeStyle='#B5852B'; ctx.lineWidth=2; ctx.beginPath();
      let started=false;
      show.forEach((v,i)=>{
        if(v===null){ started=false; return; }
        if(!started){ ctx.moveTo(x(i),y(v)); started=true; } else ctx.lineTo(x(i),y(v));
      });
      ctx.stroke();
      const lastIdx=[...show].reverse().find(v=>v!==null);
      if(lastIdx!==undefined){
        ctx.fillStyle= lastIdx>=80?'#2E6B4F':lastIdx<=20?'#A33B32':'#B5852B';
        ctx.beginPath(); ctx.arc(x(show.length-1), y(lastIdx), 4, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle='#6E675C'; ctx.font='11px JetBrains Mono, monospace';
      ctx.fillText('100', 2, y(100)+4);
      ctx.fillText('0', 2, y(0)+4);
    }
  }
}
renderCalc();

      <div style="display:flex; gap:8px; align-items:center; margin-top:4px">
        <button class="act ghost" data-reset="${r.id}">Liste zurücksetzen</button>
        <span style="font-family:var(--mono); font-size:11px; color:var(--muted)">${cnt}/${all}${st.ts?' · zuletzt '+st.ts:''}</span>
      </div>
    </div>`;
  });

  h+=`<div class="callout warn"><span class="lbl">Grenze der Routine</span>Wenn die Vorbereitung länger dauert als geplant, ist sie zur Beschäftigung geworden. Fünf Minuten Kalender-Check plus eine Wochenstunde reichen aus. Alles darüber verbessert nicht die Entscheidung, sondern nur das Gefühl, vorbereitet zu sein.</div>`;

  host.innerHTML=h;
  host.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.r, i=+b.dataset.i;
    const st=S.routine[id]||{done:[],ts:null};
    st.done = st.done.includes(i) ? st.done.filter(x=>x!==i) : [...st.done, i];
    st.ts = new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
    S.routine[id]=st; save(); renderRoutine(); go('routine');
  });
  host.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{
    S.routine[b.dataset.reset]={done:[],ts:null}; save(); renderRoutine(); go('routine');
  });
}
renderRoutine();

/* --- Reset --- */
$('#resetLink').onclick=()=>{
  if(confirm('Fortschritt, Quiz-Ergebnisse und erfasste COT-Werte löschen?')){
    localStorage.removeItem(KEY); location.reload();
  }
};
go('motor');
</script>
</body>
</html>
